<text x="180" y="239" text-anchor="middle" font-size="14" fill="#475569">REST API: request dan respons</text>
<rect x="290" y="253" width="420" height="106" rx="14" fill="#4f46e5"/>
<g fill="white" text-anchor="middle"><text x="500" y="287" font-size="21" font-weight="700">Backend Project 3 / Express</text><text x="500" y="314" font-size="16">JWT, role, booking, harga dan ledger</text><text x="500" y="339" font-size="15">Signature webhook + pemeriksaan status provider</text></g>
