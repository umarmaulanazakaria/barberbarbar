<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">Arsitektur BARBER BARBAR: tiga aplikasi, satu backend</title>
<desc id="desc">Web Management, Mobile Staff dan Customer memakai REST API backend Project 3. Backend memakai Prisma dan PostgreSQL sebagai sumber data utama, Socket.IO untuk sinyal refetch berotorisasi, serta Midtrans Sandbox untuk checkout dan verifikasi status. Webhook masuk melalui ngrok dan proxy route tunggal sebelum diverifikasi backend.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="700" rx="20" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="40" y="44" font-size="24" font-weight="700">BARBER BARBAR</text><text x="40" y="71" font-size="16" fill="#475569">Tiga antarmuka. Satu backend dan sumber data utama.</text>
<text x="730" y="72" font-size="13" fill="#0891b2">Garis putus: sinyal refetch</text><g fill="#101a3a"><rect x="40" y="104" width="280" height="85" rx="14"/><rect x="360" y="104" width="280" height="85" rx="14"/><rect x="680" y="104" width="280" height="85" rx="14"/></g>
<g fill="white" text-anchor="middle"><text x="180" y="138" font-size="19" font-weight="700">Web Management</text><text x="180" y="165" font-size="15">Project 3 / React / ADMIN + STAFF</text><text x="500" y="138" font-size="19" font-weight="700">Mobile Staff</text><text x="500" y="165" font-size="15">Project 4 / React Native + Expo</text><text x="820" y="138" font-size="19" font-weight="700">Mobile Customer</text><text x="820" y="165" font-size="15">Project 5 / React Native + Expo</text></g>
