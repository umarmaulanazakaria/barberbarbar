<g text-anchor="middle"><text x="180" y="470" font-size="20" font-weight="700">Prisma / PostgreSQL</text><text x="180" y="497" font-size="15">Data utama dan transaksi atomik</text><text x="180" y="519" font-size="14" fill="#475569">Booking, ledger dan invoice</text><text x="500" y="470" font-size="20" font-weight="700">Socket.IO</text><text x="500" y="497" font-size="15">Room sesuai identitas/peran</text><text x="500" y="519" font-size="14" fill="#475569">Event ke client memicu refetch REST</text><text x="820" y="470" font-size="20" font-weight="700">Midtrans Sandbox</text><text x="820" y="497" font-size="15">Snap, status dan refund berotorisasi</text><text x="820" y="519" font-size="14" fill="#475569">Bukan pembayaran Production</text></g>
